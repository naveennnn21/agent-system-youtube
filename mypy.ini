[mypy]
python_version = 3.12
warn_unused_configs = True
warn_redundant_casts = True
warn_return_any = True
warn_unreachable = True
ignore_missing_imports = True

# Allow untyped decorators (common for Celery tasks, FastAPI routes)
allow_untyped_decorators = True

# Disable strict optional for now (many DB model fields are Optional)
no_strict_optional = True

[mypy-celery]
ignore_missing_imports = True

[mypy-celery.*]
ignore_missing_imports = True

[mypy-kombu]
ignore_missing_imports = True

[mypy-kombu.*]
ignore_missing_imports = True

[mypy-moviepy]
ignore_missing_imports = True

[mypy-moviepy.*]
ignore_missing_imports = True

[mypy-langchain_core]
ignore_missing_imports = True

[mypy-langgraph]
ignore_missing_imports = True

[mypy-langgraph.*]
ignore_missing_imports = True

[mypy-redis]
ignore_missing_imports = True

[mypy-httpx]
ignore_missing_imports = True
